name: Deploy instant-sync hook (Cloudflare)

# Deploys cloudflare/worker.js to Carl's Cloudflare account and points eBay's instant notifications at it.
# Needs repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token) and GH_DISPATCH_TOKEN
# (fine-grained GitHub token, onc-website only, Actions: read and write). The worker gets GH_DISPATCH_TOKEN
# as its own secret so it can start the cross-list sync.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6f2e52565f35faec07c13193f8ceb73b
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${{ secrets.GH_DISPATCH_TOKEN }}" ] || { echo "::error::Missing secret GH_DISPATCH_TOKEN"; exit 1; }
      - name: Make sure the account has a workers.dev name (one-time, free)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cur=$(curl -fsS -H "$auth" "$api" | python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')" || true)
          if [ -n "$cur" ]; then echo "workers.dev name: $cur"; exit 0; fi
          for name in on-cards onc-cards outta-nowhere-cards; do
            out=$(curl -sS -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$api")
            if echo "$out" | grep -qE '"success": ?true'; then echo "Registered workers.dev name: $name"; exit 0; fi
            echo "Couldn't use $name: $out"
          done
          echo "::error::Couldn't register a workers.dev name"; exit 1
      - name: Deploy worker
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          [ -n "$url" ] || { echo "::error::No workers.dev address in the deploy output (is the workers.dev subdomain set up?)"; exit 1; }
          echo "HOOK_URL=$url" >> "$GITHUB_ENV"
          echo "### Hook address: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Whatnot webhook URL: $url/whatnot" >> "$GITHUB_STEP_SUMMARY"
      - name: Give the worker its GitHub key
        working-directory: cloudflare
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GH_DISPATCH_TOKEN
      - name: Point eBay notifications at the hook
        env:
          EBAY_SYNC_CLIENT_ID: ${{ secrets.EBAY_SYNC_CLIENT_ID }}
          EBAY_SYNC_CLIENT_SECRET: ${{ secrets.EBAY_SYNC_CLIENT_SECRET }}
          EBAY_REFRESH_ENC: ${{ runner.temp }}/ebay-refresh.enc
        run: |
          git fetch --depth 1 origin crosslist-state
          git show FETCH_HEAD:ebay-refresh.enc > "$EBAY_REFRESH_ENC"
          set -o pipefail
          python3 scripts/ebay_notifications.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test the hook
        run: curl -fsS "$HOOK_URL" && echo

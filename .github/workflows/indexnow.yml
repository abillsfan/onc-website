name: IndexNow ping (Bing, Yandex, etc.)

# After each update to the site, wait for Hostinger to deploy it, then tell IndexNow search engines
# that on-cards.com changed so they re-crawl it within minutes instead of days.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger to deploy
        run: sleep 120
      - name: Check the key file is live
        run: curl -fsS "https://on-cards.com/d214203cfca3f78ee94fc7a8aeb7f734.txt" | grep -q "d214203cfca3f78ee94fc7a8aeb7f734"
      - name: Ping IndexNow
        run: |
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"on-cards.com","key":"d214203cfca3f78ee94fc7a8aeb7f734","keyLocation":"https://on-cards.com/d214203cfca3f78ee94fc7a8aeb7f734.txt","urlList":["https://on-cards.com/"]}')
          echo "IndexNow responded $code"; cat resp.txt || true
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then exit 1; fi

name: eBay + Whatnot cross-list sync

# Started instantly by eBay/Whatnot notifications via the Cloudflare hook (cloudflare/worker.js), every 2 hours
# by its backup timer, and every 6 hours by GitHub as a last resort. Keeps cards listed on both eBay and
# Whatnot from selling twice. See scripts/crosslist_sync.py for the rules.
# Test mode until data/crosslist-config.json says "live": true.
# A failed run (double sale, eBay/Whatnot unreachable, bad key) makes GitHub email the repo owner.
on:
  schedule:
    - cron: "41 */6 * * *"   # last-resort backup (Cloudflare starts it every 2 h and on every notification)
  workflow_dispatch:
    inputs:
      reason:
        description: "What started this run (set by the Cloudflare hook)"
        required: false
        default: "manual"
  push:
    branches: [main]
    paths: [scripts/crosslist_sync.py, data/crosslist-config.json, .github/workflows/crosslist-sync.yml]

permissions:
  contents: write
  actions: write   # to start the website's eBay refresh (ebay-sync.yml)

concurrency:
  group: crosslist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Get saved sync state
        run: |
          if git fetch --depth 1 origin crosslist-state 2>/dev/null; then
            git show FETCH_HEAD:crosslist-state.json > "$RUNNER_TEMP/crosslist-state.json" || rm -f "$RUNNER_TEMP/crosslist-state.json"
            git show FETCH_HEAD:ebay-refresh.enc > "$RUNNER_TEMP/ebay-refresh.enc" || rm -f "$RUNNER_TEMP/ebay-refresh.enc"
          fi
      - name: Sync
        id: sync
        env:
          CROSSLIST_STATE: ${{ runner.temp }}/crosslist-state.json
          SYNC_REASON: ${{ github.event_name == 'schedule' && 'schedule' || inputs.reason || github.event_name }}
          EBAY_REFRESH_ENC: ${{ runner.temp }}/ebay-refresh.enc
          WHATNOT_API_TOKEN: ${{ secrets.WHATNOT_API_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_SYNC_CLIENT_ID: ${{ secrets.EBAY_SYNC_CLIENT_ID }}
          EBAY_SYNC_CLIENT_SECRET: ${{ secrets.EBAY_SYNC_CLIENT_SECRET }}
        run: python3 scripts/crosslist_sync.py
      # Website in step too: any eBay notification (new listing, ended, sold, bid, price change) or a
      # change this run made (e.g. ended an eBay listing after a Whatnot sale) refreshes On-Cards.com.
      - name: Refresh website eBay listings
        if: always() && (startsWith(inputs.reason, 'ebay:') || steps.sync.outputs.changed == 'true')
        env:
          SYNC_REASON: ${{ github.event_name == 'schedule' && 'schedule' || inputs.reason || github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ebay-sync.yml -R "$GITHUB_REPOSITORY" -f reason="crosslist:$SYNC_REASON"
      - name: Save sync state
        if: always()
        run: |
          f="$RUNNER_TEMP/crosslist-state.json"
          [ -s "$f" ] || { echo "No state to save (test mode or nothing linked)"; exit 0; }
          dir="$RUNNER_TEMP/state-branch"
          git config --global user.name "onc-crosslist-sync"
          git config --global user.email "actions@users.noreply.github.com"
          if git fetch --depth 1 origin crosslist-state 2>/dev/null; then
            git worktree add "$dir" FETCH_HEAD
            git -C "$dir" checkout -B crosslist-state
          else
            git worktree add --orphan -b crosslist-state "$dir"
          fi
          cp "$f" "$dir/crosslist-state.json"
          cd "$dir"
          git add crosslist-state.json
          git diff --cached --quiet && { echo "State unchanged"; exit 0; }
          git commit -m "Cross-list sync state"
          # Retry the push: GitHub occasionally returns a one-off 5xx error.
          for attempt in 1 2 3 4 5; do
            if out=$(git push origin crosslist-state 2>&1); then
              echo "$out"; exit 0
            fi
            echo "$out"
            # Only retry GitHub-side/network glitches; real problems fail right away.
            echo "$out" | grep -qiE 'internal server error|50[0-9]|bad gateway|service unavailable|timed out|could not resolve|unable to access|connection reset|early eof' \
              || { echo "::error::Push failed (not a temporary GitHub error)"; exit 1; }
            [ "$attempt" -lt 5 ] && { echo "Temporary GitHub error, retrying in $((attempt * 15))s..."; sleep $((attempt * 15)); }
          done
          # GitHub still down after all retries: the sync itself worked and the next run
          # re-saves state, so warn instead of failing (no failure email).
          echo "::warning::Couldn't save sync state (GitHub server error after 5 tries). Next run will save it."
